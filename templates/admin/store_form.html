{% extends 'base.html' %}
{% block title %}{% if store %}Editar{% else %}Nova{% endif %} Loja{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold mb-0">
    <i class="bi bi-shop me-2 text-primary"></i>
    {% if store %}Editar Loja{% else %}Nova Loja{% endif %}
  </h3>
  <a href="{{ url_for('admin_stores') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Voltar
  </a>
</div>

<div class="card shadow-sm" style="max-width:440px">
  <div class="card-body p-4">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nome da Loja *</label>
        <input type="text" name="name" class="form-control" required
               value="{{ store.name if store else '' }}" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Cidade</label>
        <input type="text" name="city" class="form-control"
               value="{{ store.city if store else '' }}">
      </div>
      {% if store %}
      <div class="mb-3 form-check">
        <input type="checkbox" name="is_active" class="form-check-input" id="isActive"
               {% if store.is_active %}checked{% endif %}>
        <label class="form-check-label" for="isActive">Loja ativa</label>
      </div>
      {% endif %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-circle me-1"></i>Salvar
        </button>
        <a href="{{ url_for('admin_stores') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
