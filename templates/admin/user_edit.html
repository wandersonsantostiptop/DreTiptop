{% extends 'base.html' %}
{% block title %}Editar Usuário – Admin{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold mb-0"><i class="bi bi-person-gear me-2 text-primary"></i>Editar Usuário</h3>
  <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Voltar
  </a>
</div>

<div class="card shadow-sm" style="max-width:520px">
  <div class="card-body p-4">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nome de usuário</label>
        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">E-mail</label>
        <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Nova Senha</label>
        <input type="password" name="password" class="form-control" minlength="6"
               placeholder="Deixe em branco para não alterar">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Perfil</label>
        <select name="role" class="form-select">
          <option value="user" {% if user.role == 'user' %}selected{% endif %}>Usuário</option>
          <option value="manager" {% if user.role == 'manager' %}selected{% endif %}>Gerente</option>
          <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrador</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Loja</label>
        <select name="store_id" class="form-select">
          <option value="">-- Sem loja --</option>
          {% for store in stores %}
          <option value="{{ store.id }}" {% if user.store_id == store.id %}selected{% endif %}>
            {{ store.name }}{% if store.city %} – {{ store.city }}{% endif %}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" name="is_active" class="form-check-input" id="isActive"
               {% if user.is_active %}checked{% endif %}>
        <label class="form-check-label" for="isActive">Usuário ativo</label>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle me-1"></i>Salvar
        </button>
        <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
